name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: astral-sh/setup-uv@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: unit tests
        run: cargo test --bins
      - name: every stack, end to end
        run: cargo test --test e2e -- --test-threads 2
      - run: node --test npm/anything-anything/bin/anything-anything.test.js
