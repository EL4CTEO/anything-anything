# Generated by anything-anything from anything.toml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - name: every gate, every example
        run: npx -y @el4cteo/anything-anything verify
